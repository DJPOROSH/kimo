<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devmux Dashboard</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0709;--sf:#1A0C10;--ink:#F8ECEE;--mute:#A98A90;--line:#33181F;--acc:#FF3B4E;--accs:#3A121A;--glow:#ff3b4e2e;--ok:#3DD6A3;--d:'Bricolage Grotesque','Segoe UI',sans-serif;--b:'Manrope','Segoe UI',sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#FBF3F3;--sf:#fff;--ink:#2A0F14;--mute:#8A6870;--line:#EFD9DC;--acc:#D61F36;--accs:#FDE8EB;--glow:#d61f3622;--ok:#12936B}}
:root[data-theme="light"]{--bg:#FBF3F3;--sf:#fff;--ink:#2A0F14;--mute:#8A6870;--line:#EFD9DC;--acc:#D61F36;--accs:#FDE8EB;--glow:#d61f3622;--ok:#12936B}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--b);display:flex;transition:background .5s,color .5s;font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;background:var(--acc);opacity:.13;filter:blur(90px);animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){top:-18vmax;right:-10vmax}.bg i:nth-child(2){bottom:-24vmax;left:10vmax;animation-delay:-9s;opacity:.08}
@keyframes drift{to{transform:translate(-8vmax,10vmax) scale(1.2)}}
#intro{position:fixed;inset:0;z-index:99;background:var(--acc);display:grid;place-items:center;color:#fff;clip-path:inset(0);transition:clip-path .9s cubic-bezier(.75,0,.2,1)}
#intro.out{clip-path:inset(0 0 100% 0);pointer-events:none}
.il{display:flex;align-items:center;gap:14px;font:800 clamp(44px,10vw,84px) var(--d);letter-spacing:-.04em}
.iw{display:flex;overflow:hidden;padding-bottom:6px}.iw span{display:inline-block;animation:let .8s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*70ms + .35s)}
@keyframes let{from{transform:translateY(110%)}}
.mark{display:flex;gap:4px;align-items:flex-end;height:1em}.mark i{width:.14em;background:var(--acc);border-radius:3px;animation:grow 1s cubic-bezier(.2,.9,.2,1) both}
#intro .mark i{background:#fff}.mark i:nth-child(1){height:50%}.mark i:nth-child(2){height:100%;animation-delay:.12s}.mark i:nth-child(3){height:70%;animation-delay:.24s}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}}
nav{position:relative;z-index:2;width:230px;padding:28px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);flex:none;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(12px)}
.brand{font:800 24px var(--d);letter-spacing:-.03em;display:flex;align-items:center;gap:10px;padding:0 12px 30px}.brand .mark{height:22px;font-size:22px}
.nv{position:relative;z-index:1;text-align:left;padding:11px 14px;border-radius:12px;color:var(--mute);font-weight:600;transition:color .3s,transform .3s}
.nv:hover{color:var(--ink);transform:translateX(3px)}.nv.on{color:var(--acc)}
#pill{position:absolute;z-index:0;top:0;left:0;background:var(--accs);border-radius:12px;box-shadow:inset 3px 0 0 var(--acc);transition:transform .5s cubic-bezier(.3,1.3,.5,1),width .5s,height .5s}
.stt{margin-top:auto;padding:12px;color:var(--mute);font-size:13px;display:flex;align-items:center;gap:8px}
.pd{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px #0000}100%{box-shadow:0 0 0 0 #0000}}
main{position:relative;z-index:1;flex:1;min-width:0;overflow-y:auto;padding:32px clamp(18px,4vw,60px) 56px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;margin-bottom:30px;gap:12px}
h1{font:800 clamp(34px,5vw,56px)/1 var(--d);letter-spacing:-.04em}
.sub{color:var(--mute);margin-top:8px}
.tg{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--sf);transition:transform .6s,border-color .3s;flex:none}.tg:hover{transform:rotate(180deg);border-color:var(--acc)}
.in>*{animation:up .7s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i,0)*80ms)}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.card,.tk{position:relative;background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:22px;transition:border-color .3s,transform .4s cubic-bezier(.2,.9,.2,1)}
.card::before,.tk::before{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(280px circle at var(--x,50%) var(--y,50%),var(--glow),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover,.tk:hover{border-color:var(--acc)}.card:hover::before,.tk:hover::before{opacity:1}
.card:hover{transform:translateY(-3px)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.big{font:800 clamp(36px,4.5vw,54px)/1 var(--d);letter-spacing:-.04em;margin-top:10px}
.mu{color:var(--mute);font-size:13px}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.bars{display:flex;align-items:flex-end;gap:6px;height:180px;margin-top:18px}
.bars i{flex:1;background:linear-gradient(to top,var(--accs),color-mix(in srgb,var(--acc) 60%,transparent));border-radius:7px 7px 2px 2px;height:calc(var(--h)*1%);transform-origin:bottom;animation:bar 1s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*50ms + .3s);transition:background .25s}
.bars i:hover,.bars i:last-child{background:var(--acc)}
@keyframes bar{from{transform:scaleY(0)}}
.feed{display:flex;flex-direction:column;margin-top:10px;overflow:hidden}
.fi{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);animation:slide .7s cubic-bezier(.2,.9,.2,1)}
@keyframes slide{from{opacity:0;transform:translateX(-22px);max-height:0;padding-block:0}to{max-height:60px}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}.dot.g{background:var(--ok)}.dot.r{background:var(--mute)}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;position:relative;background:var(--sf);border:1px solid var(--line);border-radius:13px;padding:4px}
.seg button{position:relative;z-index:1;padding:7px 18px;border-radius:10px;color:var(--mute);font-weight:600;transition:color .3s}.seg button.on{color:var(--acc)}
.seg .sl{position:absolute;z-index:0;top:4px;bottom:4px;background:var(--accs);border-radius:10px;transition:left .45s cubic-bezier(.3,1.3,.5,1),width .45s}
input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px;transition:border-color .3s,box-shadow .3s}
input[type=text]:focus,textarea:focus{border-color:var(--acc);outline:0;box-shadow:0 0 0 4px var(--glow)}
.srch{max-width:260px;background:var(--sf)!important}
.tk{padding:0;margin-bottom:10px;animation:up .6s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*60ms);transition:border-color .3s,opacity .45s,transform .45s}
.tk.gone{opacity:0;transform:scale(.96) translateX(30px)}
.th{width:100%;display:grid;grid-template-columns:64px 1fr auto 20px;gap:14px;align-items:center;padding:16px 20px;text-align:left}
.th b{display:block}
.chev{width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .4s}
.tk.open .chev{transform:rotate(225deg)}
.tb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.2,.9,.2,1)}.tk.open .tb{grid-template-rows:1fr}
.inner{overflow:hidden;min-height:0}.inner>div,.inner>button{margin:0 20px}.inner>button{margin-bottom:18px}
.msgs{display:flex;flex-direction:column;gap:8px;padding:2px 0 16px}
.mg{background:var(--bg);padding:9px 14px;border-radius:14px 14px 14px 4px;max-width:80%;font-size:14px}.mg.me{align-self:flex-end;background:var(--accs);border-radius:14px 14px 4px 14px}
.chip{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--accs);color:var(--acc);transition:all .4s}.chip.c{background:var(--line);color:var(--mute)}
.btn{padding:9px 18px;border-radius:12px;border:1px solid var(--line);font-weight:700;font-size:13px;transition:all .25s}
.btn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-2px)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.p:hover{color:#fff;box-shadow:0 8px 24px var(--glow)}
.vtop{display:grid;grid-template-columns:auto 1fr;gap:16px;margin-bottom:16px}
.ring{display:flex;align-items:center;gap:20px}
.ring svg{width:110px;height:110px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .t{stroke:var(--line)}.ring .f{stroke:var(--acc);stroke-dasharray:264;stroke-dashoffset:calc(264*.06);animation:ring 1.6s .3s cubic-bezier(.2,.9,.2,1) both}
@keyframes ring{from{stroke-dashoffset:264}}
.live{display:inline-flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:14px}
thead th{color:var(--mute);font-weight:600;font-size:13px}.wrap{overflow-x:auto}
tr.n{animation:flash 2.4s}@keyframes flash{from{background:var(--accs);transform:translateX(-10px)}}
.emb{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;font-size:13px;color:var(--mute);margin:16px 0 6px}
.sw{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .4s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(20px)}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.chips button{padding:4px 12px;border-radius:99px;background:var(--accs);color:var(--acc);font-size:13px;font-weight:700;transition:transform .2s}.chips button:hover{transform:scale(1.08)}
.bub{background:var(--bg);border-radius:16px;padding:18px;min-height:90px;display:flex;gap:14px;transition:opacity .4s}.bub.off{opacity:.35}
.av{width:40px;height:40px;border-radius:50%;background:var(--acc);flex:none;display:grid;place-items:center;color:#fff;font:800 16px var(--d)}
.bub.pop .bt{animation:pop .7s cubic-bezier(.3,1.5,.5,1)}@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}}
.bt b{margin-right:6px}
#auth{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;overflow-y:auto;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(22px);transition:opacity .6s,transform .6s cubic-bezier(.2,.9,.2,1)}
#auth.off{opacity:0;transform:scale(1.04);pointer-events:none}
.ac{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:380px}
.ac>*,.ah,.af{animation:up .7s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i,0)*90ms)}
.ac h2,.as h2{font:800 clamp(32px,6vw,44px)/1 var(--d);letter-spacing:-.04em}
.ac .btn.p{padding:14px 28px;font-size:15px;border-radius:14px}
.sm{font-size:12px}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.as{width:min(860px,100%)}
.ah{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:24px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:20px}
.sc{display:grid;grid-template-columns:48px 1fr;gap:6px 14px;align-items:center}
.sc .chip{justify-self:start;grid-column:1/-1}.sc .btn{grid-column:1/-1;margin-top:6px}
.si{width:48px;height:48px;border-radius:14px;background:var(--accs);color:var(--acc);display:grid;place-items:center;font:800 20px var(--d)}
.sn{display:flex;flex-direction:column}
.seg{max-width:100%;overflow-x:auto}
#pg{position:fixed;top:0;left:0;height:3px;width:100%;z-index:130;background:var(--acc);transform:scaleX(0);transform-origin:left;box-shadow:0 0 12px var(--acc);pointer-events:none}
#pg.run{animation:pgr .9s cubic-bezier(.2,.8,.2,1)}
@keyframes pgr{0%{transform:scaleX(0);opacity:1}70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
#sbar{position:fixed;z-index:60;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,200%);display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--acc);padding:10px 12px 10px 22px;border-radius:99px;box-shadow:0 14px 40px var(--glow);transition:transform .65s cubic-bezier(.3,1.4,.5,1);white-space:nowrap;font-weight:600;font-size:14px}
#sbar.show{transform:translate(-50%,0)}
.cmd .th{grid-template-columns:84px 1fr 48px 20px;cursor:pointer}
.cmd.off{opacity:.6}.cmd.off b{text-decoration:line-through;text-decoration-color:var(--mute)}
.cg{font-size:12px;font-weight:700;color:var(--acc);background:var(--accs);padding:4px 0;text-align:center;border-radius:8px}
.cs{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px;padding-bottom:18px}.cs label{margin:10px 0 8px}
.opts{display:flex;gap:6px;flex-wrap:wrap}.opts button{padding:7px 14px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mute);transition:all .3s}.opts button:hover{border-color:var(--acc)}.opts button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.rg{width:100%;accent-color:var(--acc)}
.tc{display:flex;flex-direction:column;gap:14px;margin-top:18px}.tr{display:grid;grid-template-columns:130px 1fr 34px;gap:14px;align-items:center}
.tbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.tbar i{display:block;height:100%;width:calc(var(--w)*1%);background:var(--acc);border-radius:99px;transform-origin:left;animation:sx 1.1s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*90ms + .5s)}
@keyframes sx{from{transform:scaleX(0)}}
#toast{position:fixed;z-index:120;left:50%;bottom:calc(32px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--acc);color:#fff;padding:11px 22px;border-radius:99px;opacity:0;transition:all .45s cubic-bezier(.3,1.4,.5,1);pointer-events:none;font-weight:700;font-size:14px;box-shadow:0 10px 30px var(--glow)}
#toast.s{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){
body{flex-direction:column-reverse}
nav{width:100%;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:8px;gap:0;justify-content:space-around}
.brand,.stt{display:none}.nv{padding:9px 4px;font-size:12px;text-align:center;flex:1}.nv:hover{transform:none}
.grid{grid-template-columns:1fr 1fr}.two,.emb,.vtop{grid-template-columns:1fr}
.th{grid-template-columns:1fr auto 20px}.th>.mu{display:none}
#toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}#sbar{bottom:calc(76px + env(safe-area-inset-bottom,0px))}.cs{grid-template-columns:1fr}.cmd .th{grid-template-columns:1fr 48px 20px}.cg{display:none}.tr{grid-template-columns:100px 1fr 30px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#intro{display:none}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i></div>
<div id="intro"><div class="il"><span class="mark"><i></i><i></i><i></i></span><span class="iw" id="iw"></span></div></div>
<div id="auth"></div>
<nav id="nav">
<div class="brand"><span class="mark"><i></i><i></i><i></i></span>Devmux</div>
<div id="pill"></div>
<div class="stt"><span class="pd"></span>Bot online</div>
</nav>
<main>
<header><div><h1 id="t"></h1><p class="sub" id="s"></p></div><div style="display:flex;gap:10px;align-items:center"><button class="btn" id="srv" aria-label="Switch server"></button><button class="tg" id="tg" aria-label="Switch light or dark theme">◐</button></div></header>
<section id="v"></section>
</main>
<div id="pg"></div><div id="sbar" role="region" aria-label="Unsaved changes"><span>You have unsaved changes</span><button class="btn" id="rs">Reset</button><button class="btn p" id="sv">Save changes</button></div>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const V={overview:['Devmux','Your server at a glance.'],tickets:['Tickets','Open a ticket to read it, then close or reopen it.'],verify:['Verify','Members who passed verification.'],welcome:['Welcome','Greet every new member automatically.'],leave:['Leave','Send a message when someone leaves.'],commands:['Commands','Turn commands on or off and choose who can use them.']};
const nav=$('#nav');
Object.keys(V).forEach(k=>{const b=document.createElement('button');b.className='nv';b.textContent=k[0].toUpperCase()+k.slice(1);b.dataset.k=k;b.onclick=()=>go(k);nav.insertBefore(b,$('.stt'))});
$('#iw').innerHTML=[...'Devmux'].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('');
setTimeout(()=>$('#intro').classList.add('out'),2000);setTimeout(()=>$('#intro').remove(),3100);
let tickets=[{id:'#0142',s:'Cannot join voice channels',u:'mira',a:'12m',o:1,m:["Hi, I can't join any voice channel.","Thanks! Checking your role permissions now."]},{id:'#0141',s:'Role not given after verify',u:'kai',a:'41m',o:1,m:["I pressed verify but got no role.","Fixed. Please check again."]},{id:'#0140',s:'Partnership request',u:'orion',a:'2h',o:1,m:["We would like to partner with your server."]},{id:'#0139',s:'Report: spam in #general',u:'lena',a:'5h',o:0,m:["Someone is posting invites in #general.","Handled, thank you for the report."]},{id:'#0138',s:'Need a name change',u:'dax',a:'1d',o:0,m:["Can you update my nickname?","Done."]}];
const names=['nova','rex','juno','ash','lux','pax','zed','mo','eli','tess'],dates=['May 2, 2024','Nov 11, 2021','Feb 27, 2023','Jul 9, 2022'];
let vlog=[['nova','4821907350264','Mar 3, 2023'],['rex','7710283946120','Jan 19, 2022'],['juno','2209481736592','Aug 8, 2024'],['ash','5530918274401','Sep 30, 2023']];
let wl={welcome:{on:1,ch:'#welcome',msg:'Welcome {user} to {server}! You are member #{count}.'},leave:{on:1,ch:'#goodbye',msg:'{user} has left {server}. We now have {count} members.'}};
let timers=[],live=1,G=null,U=null,gs={};
const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('s');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('s'),2100)};
function pill(){const a=nav.querySelector('.nv.on'),p=$('#pill');if(!a)return;p.style.width=a.offsetWidth+'px';p.style.height=a.offsetHeight+'px';p.style.transform=`translate(${a.offsetLeft}px,${a.offsetTop}px)`}
function count(){const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,t0=performance.now();const f=t=>{const p=rm?1:Math.min((t-t0)/1500,1);e.textContent=Math.round(n*(1-Math.pow(1-p,4)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function seg(el,opts,cb){el.innerHTML='<span class="sl"></span>'+opts.map((o,i)=>`<button class="${i?'':'on'}">${o}</button>`).join('');const m=()=>{const a=el.querySelector('.on'),s=el.querySelector('.sl');s.style.left=a.offsetLeft+'px';s.style.width=a.offsetWidth+'px'};el.querySelectorAll('button').forEach(b=>b.onclick=()=>{el.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');m();cb(b.textContent)});requestAnimationFrame(m)}
